name: docs

on:
  push:
    branches:
      - master
      - main
env:
  SITE_DIR: "gh-pages"
jobs:
  build_site:
    name: "Build site with Antora"
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: "Generate site using antora site action"
        uses: kameshsampath/antora-site-action@master
        with:
          antora_playbook: site.yml
      - name: "Publish Antora assets from a GitHub Pages compatible path"
        run: |
          cp -R "${{ env.SITE_DIR }}/_." "${{ env.SITE_DIR }}/antora-assets"
          find "${{ env.SITE_DIR }}" -type f -name '*.html' -exec sed -i \
            -e 's#../_/css/#../antora-assets/css/#g' \
            -e 's#../_/img/#../antora-assets/img/#g' \
            -e 's#../_/js/#../antora-assets/js/#g' \
            -e 's#href="_/#href="antora-assets/#g' \
            -e 's#src="_/#src="antora-assets/#g' {} +
      - name: "Upload generated site"
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: "${{ github.workspace }}/${{ env.SITE_DIR }}"
  deploy_site:
    runs-on: [ubuntu-latest]
    needs: [build_site]
    name: "Deploy GitHub Pages"
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Download generated site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: "${{ github.workspace }}/${{ env.SITE_DIR }}"
      - name: "Disable Jekyll processing for Antora assets"
        run: touch "${{ env.SITE_DIR }}/.nojekyll"
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@3.2.1
        with:
          # ACCESS_TOKEN: # optional
          GITHUB_TOKEN: "${{ github.token}}"
          FOLDER: "${{ env.SITE_DIR }}"
          BRANCH: "gh-pages"
          COMMIT_MESSAGE: "[CI] Publish Documentation for ${{ github.sha }}"
