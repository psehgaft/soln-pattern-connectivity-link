apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: workshop
  labels:
    kuadrant.io/gateway: "true"
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      hostname: "*.toystore.test"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: toystore
  labels:
    app: toystore
spec:
  parentRefs:
    - name: workshop
  hostnames:
    - api.toystore.test
  rules:
    - matches:
        - path:
            type: Exact
            value: /toy
          method: GET
      backendRefs:
        - name: toystore
          port: 80
