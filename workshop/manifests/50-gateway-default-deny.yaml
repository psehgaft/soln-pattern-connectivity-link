apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: gateway-default-deny
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: workshop
  defaults:
    strategy: atomic
    rules:
      authorization:
        deny-all:
          opa:
            rego: "allow = false"
      response:
        unauthorized:
          headers:
            content-type:
              value: application/json
          body:
            value: |
              {
                "error": "Forbidden",
                "message": "This route has no application AuthPolicy."
              }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unprotected-demo
  labels:
    app: toystore
spec:
  parentRefs:
    - name: workshop
  hostnames:
    - blocked.toystore.test
  rules:
    - matches:
        - path:
            type: Exact
            value: /toy
          method: GET
      backendRefs:
        - name: toystore
          port: 80
