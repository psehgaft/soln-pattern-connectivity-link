apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../workshop/manifests/10-app.yaml
  - ../../workshop/manifests/20-gateway-route.yaml
  - ../../workshop/manifests/30-auth-policy.yaml
  - ../../workshop/manifests/31-demo-api-keys.yaml
  - ../../workshop/manifests/40-rate-limit.yaml
  - ../../workshop/manifests/50-gateway-default-deny.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: toystore
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: toystore
        annotations:
          argocd.argoproj.io/sync-wave: "0"
  - target:
      version: v1
      kind: Service
      name: toystore
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: toystore
        annotations:
          argocd.argoproj.io/sync-wave: "0"
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: workshop
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: workshop
        annotations:
          argocd.argoproj.io/sync-wave: "1"
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: toystore
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: toystore
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: unprotected-demo
    patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: unprotected-demo
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - target:
      version: v1
      kind: Secret
      name: alice-key
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: alice-key
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - target:
      version: v1
      kind: Secret
      name: bob-key
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: bob-key
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - target:
      group: kuadrant.io
      version: v1
      kind: AuthPolicy
      name: toystore
    patch: |-
      apiVersion: kuadrant.io/v1
      kind: AuthPolicy
      metadata:
        name: toystore
        annotations:
          argocd.argoproj.io/sync-wave: "3"
  - target:
      group: kuadrant.io
      version: v1
      kind: AuthPolicy
      name: gateway-default-deny
    patch: |-
      apiVersion: kuadrant.io/v1
      kind: AuthPolicy
      metadata:
        name: gateway-default-deny
        annotations:
          argocd.argoproj.io/sync-wave: "4"
  - target:
      group: kuadrant.io
      version: v1
      kind: RateLimitPolicy
      name: toystore
    patch: |-
      apiVersion: kuadrant.io/v1
      kind: RateLimitPolicy
      metadata:
        name: toystore
        annotations:
          argocd.argoproj.io/sync-wave: "4"
