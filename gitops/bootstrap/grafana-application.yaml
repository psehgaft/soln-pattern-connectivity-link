apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: connectivity-link-grafana-metering
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/psehgaft/soln-pattern-connectivity-link.git
    targetRevision: main
    path: gitops/monetization/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: connectivity-link-workshop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
