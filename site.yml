runtime:
  cache_dir: ./.cache/antora
site:
  title: Open Demo days | Connectivity Link Workshop
  url: https://psehgaft.github.io/soln-pattern-connectivity-link
  start_page: solution-pattern::index.adoc
content:
  sources:
    - url: ./
      start_path: documentation
asciidoc:
  attributes:
    release-version: master
    page-pagination: true
  extensions:
    - ./lib/tab-block.js
    - ./lib/remote-include-processor.js
ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/v2.0.2/ui-bundle.zip
    snapshot: false
  supplemental_files: ./supplemental-ui
output:
  dir: ./gh-pages
